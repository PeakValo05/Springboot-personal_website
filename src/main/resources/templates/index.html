<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>

    <!--Linke to fonts-->

            <!--Linke to fonts-->
        <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>


    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Emblema+One&family=Krona+One&family=Montenegrin+Gothic+One&family=Oswald:wght@200..700&family=Pacifico&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">

    



<!-- Links to my CSS files -->
<link rel="stylesheet" th:href="@{/CSS/HomePageCSS/bars.css(v=4)}">
<link rel="stylesheet" th:href="@{/CSS/HomePageCSS/buttons.css(v=4)}">
<link rel="stylesheet" th:href="@{/CSS/HomePageCSS/cards.css(v=5)}">
<link rel="stylesheet" th:href="@{/CSS/HomePageCSS/header-responsive.css(v=4)}">
<link rel="stylesheet" th:href="@{/CSS/HomePageCSS/content.css(v=4)}">
<link rel="stylesheet" th:href="@{/CSS/HomePageCSS/body-content.css(v=4)}">
<link rel="stylesheet" th:href="@{/CSS/HomePageCSS/header.css(v=4)}">
<link rel="stylesheet" th:href="@{/CSS/HomePageCSS/table.css(v=5)}">
<link rel="stylesheet" th:href="@{/CSS/HomePageCSS/animated-arrow.css}">
<link rel="stylesheet" th:href="@{/CSS/HomePageCSS/body-content-responsive.css(v=4)}">
<link rel="stylesheet" th:href="@{/CSS/HomePageCSS/table-responsive.css(v=5)}">
<link rel="stylesheet" th:href="@{/CSS/HomePageCSS/buttons-responsive.css(v=5)}">
<link rel="stylesheet" th:href="@{/CSS/HomePageCSS/mobile-btn.css(v=5)}">
<link rel="stylesheet" th:href="@{/CSS/HomePageCSS/main-blocks.css(v=4)}">



    
</head>

<body>
    <section th:class="@{home-page}">


<!--Container for the top bar-->
        <div class="top-bar-container">
               <!--Top bar with name profile pic, etc-->
        <div class="top-bar">
            <img th:src="@{images/SelfImage.jpeg}" class="self-image">
            <p class="top-bar-text">Jackson<br> Wiser</p>
            </div>
        </div>

<div class="grouping-blocks">

    <div class="analytics-block-container">
        <div class="analytics-block">

            <div th:each="analytic : ${analytics}" class="analytics-card">

                <!--Projects completed-->
                <div class="analytics-row">
                    <div class="analytics-label">
                        <span>Projects Completed</span>
                        <span th:text="${analytic.projectsCompleted} + '+'"></span>
                    </div>

                    <!--Fill bar-->
                    <div class="analytics-bar">
                        <div class="analytics-fill"
                             th:style="'width: ' + ${analytic.projectsCompleted * 10} + '%'">
                        </div>
                    </div>
                </div>

                <!--Amount of repositories-->
                <div class="analytics-row">
                    <div class="analytics-label">
                        <span>Repositories</span>
                        <span th:text="${analytic.repositories} + '+'"></span>
                    </div>

                    <!--Fill bar-->
                    <div class="analytics-bar">
                        <div class="analytics-fill"
                             th:style="'width: ' + ${analytic.repositories * 5} + '%'">
                        </div>
                    </div>
                </div>

                <!--Languages known-->
                <div class="analytics-row">
                    <div class="analytics-label">
                        <span>Languages Known</span>
                        <span th:text="${analytic.languagesKnown}"></span>
                    </div>

                    <!--Fill bar-->
                    <div class="analytics-bar">
                        <div class="analytics-fill"
                             th:style="'width: ' + ${analytic.languagesKnown * 10} + '%'">
                        </div>
                    </div>
                </div>

                <!--Amount of commits-->
                <div class="analytics-row">
                    <div class="analytics-label">
                        <span>Commits</span>
                        <span th:text="${analytic.commits} + '+'"></span>
                    </div>

                    <!--Fill bar-->
                    <div class="analytics-bar">
                        <div class="analytics-fill"
                             th:style="'width: ' + ${analytic.commits / 10} + '%'">
                        </div>
                    </div>
                </div>

                <!--Years of programming-->
                <div class="analytics-row">
                    <div class="analytics-label">
                        <span>Years Programming</span>
                        <span th:text="${analytic.yearsProgramming} + '+'"></span>
                    </div>

                    <!--Fill bar-->
                    <div class="analytics-bar">
                        <div class="analytics-fill"
                             th:style="'width: ' + ${analytic.yearsProgramming * 20} + '%'">
                        </div>
                    </div>
                </div>

            </div>

        </div>
    </div>

</div>
<!-- Education block container -->
<div class="education-block-container">
    <div class="education-block">


    <div class="education-label">
        <h2 class="section-title">Education</h2>
    </div>


    <div th:each="education : ${educationList}" class="education-card">
<!-- Education card -->
    <div class="education-name">
        <h3 th:text="${education.name}"></h3>
    </div>
<!-- Display the degree in a single line -->
    <div class="education-degree">
        <p th:text="${education.degree}"></p>
    </div>

<!-- Display the city and state in a single line -->
    <div class="education-location">
        <p th:text="${education.city} + ', ' + ${education.state}"></p>
    </div>

    <div class="education-circle-progress"
        th:style="'--percentage: ' + ${education.percentage}">
   

        <div class="education-circle-inner">
            <span th:text="${education.percentage}"></span>%
        </div>
        </div>
</div>
    </div>
</div>









            <!--Block that hold all the education-->
    <div class="skills-block-container">

        <div class="skills-block">

<div th:each="skill : ${skills}" class="skill-card">

    <div class="block-container">
    <img class="skills-image"
         th:src="${skill.skillsImage}"
         th:alt="${skill.name}">
         </div>
<!-- Skill name -->
    <div class="skill-info">
        <h3 th:text="${skill.name}"></h3>


        <!-- Progress bar (blue) of the circle -->
        <div class="circle-progress"
            th:style="'--percentage: ' + ${skill.percentage}">
   
<!-- Inner circle that displays the percentage -->
        <div class="circle-inner">
            <span th:text="${skill.percentage}"></span>%
        </div>
        </div>





    </div>
</div>
    </div>
</div>



    
<div class="side-bar-container">

    <div class="logo-name-container">
        <img th:src="@{images/PVLogoBlack.png}" class="PV-logo">
        <p>PeaksValo</p>
    </div>

    

    <span class="section-title">Essentials</span>
    <div class="text-wrap">
        <a th:href="@{#}">
            <img th:src="@{SVG Images/laptop.svg}" class="projects-btn">
        </a>
        <p style="color: black">Projects</p>
    </div>

    <div class="text-wrap">
        <a th:href="@{/about}">
            <img th:src="@{SVG Images/file-person-fill.svg}" class="about-btn">
        </a>
        <p style="color: black">About</p>
    </div>

    <div class="text-wrap">
        <a th:href="@{/contact}">
            <img th:src="@{SVG Images/envelope-arrow-down-fill.svg}" class="contact-btn">
        </a>
        <p style="color: black">Contact</p>
    </div>

    <div class="text-wrap">
        <a th:href="@{/connect}">
            <img th:src="@{SVG Images/person-lines-fill.svg}" class="connect-btn">
        </a>
        <p style="color: black">Connect</p>
    </div>

    <div class="text-wrap">
        <a th:href="@{/assets/Jackson's Resume.pdf}">
            <img th:src="@{SVG Images/cloud-arrow-down-fill.svg}" class="download-resume-btn">
        </a>
        <p style="color: black">Resume</p>
    </div>

</div>


 







        <!--MOBILE button-->
    <button class="hamburger-btn" id="hamburger-btn">
    <span class="icon">
        <svg viewBox="0 0 175 80" width="40" height="40">
            <rect width="80" height="15" fill="#f0f0f0" rx="10"></rect>
            <rect y="30" width="80" height="15" fill="#f0f0f0" rx="10"></rect>
            <rect y="60" width="80" height="15" fill="#f0f0f0" rx="10"></rect>
        </svg>
    </span>
    <span class="text">MENU</span>
</button>

    <!-- Mobile Menu -->
    <div class="mobile-menu">
        <a th:href="@{/}">Home</a>
        <a th:href="@{/about}">About</a>
        <a th:href="@{/contact}">Contact</a>
        <a th:href="@{/connect}">Connect</a>
    </div>


    <!-- ==== END of the CONTAINER that started at "logo-name-container" ==== -->
    </div>


        
            



                    <!--Scroll to bottom of main page-->
    <section>
        <div class="arrow-container">
       <button id="scrollBottomBtn" class="scroll-bottom">
            <img th:src="@{/SVG Images/chevron-double-down.svg}" class="arrow-icon" alt="Scroll Down">
       </button>
            
        </button>

    </div>
</section>

            </div>
        </div>
        </section>
    </section>




      




<!--SCRIPTS-->

<!--Scroll top function-->
<script>

const scrollTopBtn = document.getElementById("scrollTopBtn");

scrollTopBtn.addEventListener("click", () => {
    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
});

</script>



<!--Scroll down function-->
<script>

const scrollBottomBtn = document.getElementById("scrollBottomBtn");

scrollBottomBtn.addEventListener("click", () => {
    window.scrollTo({
        top: document.documentElement.scrollHeight,
        behavior: "smooth"
    });
});

</script>
    


    <!-- Hamburger Menu Script -->
    <script>
const burger = document.getElementById("hamburger-btn");
const mobileMenu = document.querySelector(".mobile-menu");

burger.addEventListener("click", () => {
    console.log("clicked");
    mobileMenu.classList.toggle("active");
});
    </script>

</body>

</html>
